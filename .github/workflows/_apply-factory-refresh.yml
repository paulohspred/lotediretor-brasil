name: apply-factory-refresh

on:
  push:
    branches: [fix/v20-production-readiness]
    paths:
      - .github/workflows/_apply-factory-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v20-production-readiness
      - name: Patch municipality factory refresh semantics
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('services/platform-api/src/municipality/municipality-factory.controller.ts')
          text=p.read_text()

          start="  @Post('sources/:id/ingest') async ingest"
          end="\n\n  @Post('sources/:id/snapshots/:snapshotId/qa')"
          i=text.find(start); j=text.find(end,i)
          if i<0 or j<0: raise SystemExit('ingest method boundaries not found')
          ingest="""  @Post('sources/:id/ingest') async ingest(@Req() req:any,@Param('id') id:string){const x=await this.context(req,'dataset.manage'),src=await this.source(x,id);if(src.connector_status!=='ACTIVE')throw new HttpException('factory_source_not_active',409);const configFingerprint=sha256Hex(JSON.stringify({endpoint:src.endpoint_url,adapter:src.adapter,pinned:src.pinned_config,contract:[src.contract_code,src.contract_version]}));try{const r=await ingestSource({adapter:src.adapter,endpointUrl:src.endpoint_url,pinnedConfig:src.pinned_config,municipalityIbge:src.municipality_ibge,datasetCode:src.dataset_code,contractCode:src.contract_code,contractVersion:Number(src.contract_version)});const fingerprint=sha256Hex(JSON.stringify({configFingerprint,contentSha256:r.sha256}));return tenantTx(pool,x.s.organizationId,async c=>{const prior=(await c.query(`select * from municipality.factory_connector_run where factory_source_id=$1 and run_kind='INGEST' and request_fingerprint=$2 and status='SUCCEEDED'`,[id,fingerprint])).rows[0];if(prior){await c.query(`update municipality.factory_source set last_ingested_at=now(),last_success_at=now() where id=$1`,[id]);return{replayed:true,run:prior};}let snap=(await c.query(`select * from source.snapshot where source_id=$1 and sha256=$2`,[src.source_id,r.sha256])).rows[0];if(!snap)snap=(await c.query(`insert into source.snapshot(source_id,source_date,parser_version,sha256,object_key,metadata,validation_status,record_count) values($1,coalesce($2::timestamptz,now()),$3,$4,$5,$6::jsonb,'PENDING',$7) returning *`,[src.source_id,r.metadata?.sourceDate||null,MUNICIPALITY_FACTORY_VERSION,r.sha256,r.objectKey,JSON.stringify(r.metadata),r.featureCount])).rows[0];const runMetrics={pageCount:r.pageCount,featureCount:r.featureCount,contentType:r.contentType,qa:r.metadata};const run=(await c.query(`insert into municipality.factory_connector_run(municipality_tenant_id,factory_source_id,run_kind,status,request_fingerprint,source_snapshot_id,object_key,sha256,byte_size,metrics,finished_at) values($1,$2,'INGEST','SUCCEEDED',$3,$4,$5,$6,$7,$8::jsonb,now()) returning *`,[x.municipality.id,id,fingerprint,snap.id,r.objectKey,r.sha256,r.byteSize,JSON.stringify(runMetrics)])).rows[0];await c.query(`update municipality.factory_source set last_ingested_at=now(),last_success_at=now(),connector_status='ACTIVE' where id=$1`,[id]);await audit(c,x.municipality.id,x.subject,'FACTORY_INGEST_SUCCEEDED','municipality.factory_connector_run',run.id,{sourceSnapshotId:snap.id,sha256:r.sha256,byteSize:r.byteSize,replayed:false});return{run,sourceSnapshot:snap};});}catch(e:any){const code=errCode(e);const failureFingerprint=sha256Hex(JSON.stringify({configFingerprint,error:code,minute:new Date().toISOString().slice(0,16)}));await tenantTx(pool,x.s.organizationId,async c=>{await c.query(`insert into municipality.factory_connector_run(municipality_tenant_id,factory_source_id,run_kind,status,request_fingerprint,error_code,error_detail,finished_at) values($1,$2,'INGEST','FAILED',$3,$4,$4,now()) on conflict(factory_source_id,run_kind,request_fingerprint) do update set error_code=excluded.error_code,error_detail=excluded.error_detail,finished_at=now()`,[x.municipality.id,id,failureFingerprint,code]);await c.query(`update municipality.factory_source set connector_status='FAILED',last_ingested_at=now() where id=$1`,[id]);});throw new HttpException({error:'factory_ingest_failed',code},502);}}"""
          text=text[:i]+ingest+text[j:]

          old="select r.id,s.metadata,s.source_date from municipality.factory_connector_run r join source.snapshot s on s.id=r.source_snapshot_id where r.factory_source_id=$1 and r.source_snapshot_id=$2 and r.run_kind='INGEST' and r.status='SUCCEEDED'"
          new="select r.id,r.metrics,s.metadata,s.source_date from municipality.factory_connector_run r join source.snapshot s on s.id=r.source_snapshot_id where r.factory_source_id=$1 and r.source_snapshot_id=$2 and r.run_kind='INGEST' and r.status='SUCCEEDED' order by r.finished_at desc limit 1"
          if text.count(old)!=1: raise SystemExit(f'qa run query match count={text.count(old)}')
          text=text.replace(old,new,1)
          old="sourceDate:run.metadata?.sourceDate||run.source_date||null,featureCount:run.metadata?.featureCount,invalidGeometryCount:run.metadata?.invalidGeometryCount,unknownCrs:run.metadata?.unknownCrs!==false,documentPages:b?.documentPages,citations:b?.citations,structureOk:run.metadata?.structureOk===true"
          new="sourceDate:run.metrics?.qa?.sourceDate||run.metadata?.sourceDate||run.source_date||null,featureCount:run.metrics?.qa?.featureCount??run.metadata?.featureCount,invalidGeometryCount:run.metrics?.qa?.invalidGeometryCount??run.metadata?.invalidGeometryCount,unknownCrs:(run.metrics?.qa?.unknownCrs??run.metadata?.unknownCrs)!==false,documentPages:b?.documentPages,citations:b?.citations,structureOk:(run.metrics?.qa?.structureOk??run.metadata?.structureOk)===true"
          if text.count(old)!=1: raise SystemExit(f'qa evidence match count={text.count(old)}')
          text=text.replace(old,new,1)
          old="await c.query(`update source.snapshot set status=$2 where id=$1`,[snapshotId,allPass?'VALIDATED':'DRAFT']);"
          new="await c.query(`update source.snapshot set validation_status=$2 where id=$1`,[snapshotId,allPass?'PASS':'FAIL']);"
          if text.count(old)!=1: raise SystemExit(f'validation status match count={text.count(old)}')
          text=text.replace(old,new,1)
          old="const x=await this.context(req,'dataset.manage');await this.source(x,id);const snapshotId=String(b?.sourceSnapshotId||'');const items=Array.isArray(b?.items)?b.items:[];if(!snapshotId||!items.length)throw new HttpException('sourceSnapshotId_and_items_required',400);return tenantTx(pool,x.s.organizationId,async c=>{const ok=await c.query(`select 1 from municipality.factory_qa_result where factory_source_id=$1 and source_snapshot_id=$2 and status='PASS' limit 1`,[id,snapshotId]);if(!ok.rowCount)throw new HttpException('candidate_generation_requires_qa',409);"
          new="const x=await this.context(req,'dataset.manage'),src=await this.source(x,id);const snapshotId=String(b?.sourceSnapshotId||'');const items=Array.isArray(b?.items)?b.items:[];if(!snapshotId||!items.length)throw new HttpException('sourceSnapshotId_and_items_required',400);const requiredQa=requiredQaKinds(src.media_class);return tenantTx(pool,x.s.organizationId,async c=>{const qa=(await c.query(`select qa_kind,status from municipality.factory_qa_result where factory_source_id=$1 and source_snapshot_id=$2 and qa_kind=any($3::text[])`,[id,snapshotId,requiredQa])).rows;const passed=new Set(qa.filter((q:any)=>q.status==='PASS').map((q:any)=>q.qa_kind));if(requiredQa.some((kind:string)=>!passed.has(kind)))throw new HttpException('candidate_generation_requires_all_qa',409);"
          if text.count(old)!=1: raise SystemExit(f'candidate gate match count={text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text)
      - name: Verify contracts
        shell: bash
        run: |
          grep -q 'contentSha256:r.sha256' services/platform-api/src/municipality/municipality-factory.controller.ts
          grep -q "validation_status=\$2" services/platform-api/src/municipality/municipality-factory.controller.ts
          grep -q 'candidate_generation_requires_all_qa' services/platform-api/src/municipality/municipality-factory.controller.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/platform-api/src/municipality/municipality-factory.controller.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(municipality): refresh sources and require authoritative QA'
          git push origin HEAD:fix/v20-production-readiness

name: apply-readiness-patches

on:
  push:
    branches: [fix/v20-production-readiness]
    paths:
      - .github/workflows/_apply-readiness-patches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v20-production-readiness
      - name: Apply deterministic large-file patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'services/platform-api/src/territorial/analysis-v20.service.ts',
              'legalTemporalUnknownCount:temporalDecisionUnknown});',
              'legalTemporalUnknownCount:temporalDecisionUnknown,legalTemporalPendingCount:temporal.pendingRelationIds.length});',
          )

          controller = 'services/platform-api/src/municipality/municipality-factory.controller.ts'
          replace_once(
              controller,
              "select id from municipality.factory_connector_run where factory_source_id=$1 and source_snapshot_id=$2 and run_kind='INGEST' and status='SUCCEEDED'",
              "select r.id,s.metadata,s.source_date from municipality.factory_connector_run r join source.snapshot s on s.id=r.source_snapshot_id where r.factory_source_id=$1 and r.source_snapshot_id=$2 and r.run_kind='INGEST' and r.status='SUCCEEDED'",
          )
          replace_once(
              controller,
              "sourceDate:b?.sourceDate||null,featureCount:b?.featureCount,invalidGeometryCount:b?.invalidGeometryCount,unknownCrs:Boolean(b?.unknownCrs),documentPages:b?.documentPages,citations:b?.citations,structureOk:b?.structureOk===true",
              "sourceDate:run.metadata?.sourceDate||run.source_date||null,featureCount:run.metadata?.featureCount,invalidGeometryCount:run.metadata?.invalidGeometryCount,unknownCrs:run.metadata?.unknownCrs!==false,documentPages:b?.documentPages,citations:b?.citations,structureOk:run.metadata?.structureOk===true",
          )
          replace_once(
              controller,
              "const allPass=rows.every((q:any)=>q.status==='PASS');if(allPass)await c.query(`update source.snapshot set status='VALIDATED' where id=$1`,[snapshotId]);await audit",
              "const allPass=rows.every((q:any)=>q.status==='PASS');await c.query(`update source.snapshot set status=$2 where id=$1`,[snapshotId,allPass?'VALIDATED':'DRAFT']);if(!allPass)await c.query(`update municipality.factory_source set homologation_status=case when homologation_status='CONFIRMED' then 'CANDIDATE' else homologation_status end where id=$1`,[id]);await audit",
          )
      - name: Verify patch contracts
        shell: bash
        run: |
          grep -q 'legalTemporalPendingCount:temporal.pendingRelationIds.length' services/platform-api/src/territorial/analysis-v20.service.ts
          grep -q 'featureCount:run.metadata?.featureCount' services/platform-api/src/municipality/municipality-factory.controller.ts
          grep -q "allPass?'VALIDATED':'DRAFT'" services/platform-api/src/municipality/municipality-factory.controller.ts
      - name: Commit patches
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/platform-api/src/territorial/analysis-v20.service.ts services/platform-api/src/municipality/municipality-factory.controller.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v20): fail closed on pending law and municipal QA'
          git push origin HEAD:fix/v20-production-readiness

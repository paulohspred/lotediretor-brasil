name: ci
on: [push, pull_request]
jobs:
  static-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install PyYAML reportlab requests
      - run: ./validate-v19-rc3.sh
      - run: npm install --workspaces --include-workspace-root --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: docker compose -f docker-compose.yml config >/dev/null
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config >/dev/null
        env:
          PUBLIC_DOMAIN: app.test.invalid
          AUTH_DOMAIN: auth.test.invalid
          ACME_EMAIL: ci@example.invalid
          KEYCLOAK_ADMIN: ci
          KEYCLOAK_ADMIN_PASSWORD: ci-ci-ci-ci
          OIDC_CLIENT_SECRET: ci-ci-ci-ci-ci
          INTERNAL_API_TOKEN: ci-ci-ci-ci-ci
          PLATFORM_DB_MIGRATION_USER: lotediretor
          PLATFORM_DB_MIGRATION_PASSWORD: ci-platform-owner
          PLATFORM_DB_NAME: lotediretor
          PLATFORM_DB_APP_PASSWORD: ci-platform-app
          PLATFORM_DB_TILES_PASSWORD: ci-tiles
          PLATFORM_DB_EVENT_PASSWORD: ci-platform-event
          PLATFORM_DB_WORKER_PASSWORD: ci-platform-worker
          CONTROL_DB_MIGRATION_USER: lotediretor_control
          CONTROL_DB_MIGRATION_PASSWORD: ci-control-owner
          CONTROL_DB_NAME: lotediretor_control
          CONTROL_DB_APP_PASSWORD: ci-control-app
          CONTROL_DB_WORKER_PASSWORD: ci-control-worker
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-ci-ci-ci-ci

name: ci
on: [push, pull_request]
jobs:
  static-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install Python validation dependencies
        run: pip install PyYAML reportlab requests shapely pyproj pypdf fastapi pydantic boto3 "psycopg[binary]"
      - name: Install Node workspaces reproducibly
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Run RC3 validation
        run: ./validate-v19-rc3.sh
      - name: Run v20 incremental validation
        run: |
          python tests/validate_v20_core_legal.py
          python tests/test_sao_paulo_v20_streaming_sync.py
          python tests/validate_v20_ai_core_runtime.py
          python tests/validate_v20_aitec_advanced.py
          python tests/validate_v20_solar.py
          python tests/validate_v20_property_rural.py
          python tests/validate_v20_condo.py
          python tests/validate_v20_municipality.py
          python tests/validate_v20_admin_saas.py
          python tests/validate_v20_municipality_factory.py
          python tests/validate_v20_privacy.py
          node tests/test_v20_ai_runtime.js
          node tests/test_v20_ai_retrieval_context.js
          node tests/test_v20_ai_provenance_ids.js
          node tests/test_v20_ai_redteam_eval.js
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate development compose
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate full observability compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.ops.yml --profile full --profile ops config >/dev/null
      - name: Validate Prometheus configuration and rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Validate production compose
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config >/dev/null
        env:
          PUBLIC_DOMAIN: app.test.invalid
          AUTH_DOMAIN: auth.test.invalid
          ACME_EMAIL: ci@example.invalid
          KEYCLOAK_ADMIN: ci
          KEYCLOAK_ADMIN_PASSWORD: ci-ci-ci-ci
          OIDC_CLIENT_SECRET: ci-ci-ci-ci-ci
          INTERNAL_API_TOKEN: ci-ci-ci-ci-ci
          PLATFORM_DB_MIGRATION_USER: lotediretor
          PLATFORM_DB_MIGRATION_PASSWORD: ci-platform-owner
          PLATFORM_DB_NAME: lotediretor
          PLATFORM_DB_APP_PASSWORD: ci-platform-app
          PLATFORM_DB_TILES_PASSWORD: ci-tiles
          PLATFORM_DB_EVENT_PASSWORD: ci-platform-event
          PLATFORM_DB_WORKER_PASSWORD: ci-platform-worker
          CONTROL_DB_MIGRATION_USER: lotediretor_control
          CONTROL_DB_MIGRATION_PASSWORD: ci-control-owner
          CONTROL_DB_NAME: lotediretor_control
          CONTROL_DB_APP_PASSWORD: ci-control-app
          CONTROL_DB_WORKER_PASSWORD: ci-control-worker
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-ci-ci-ci-ci

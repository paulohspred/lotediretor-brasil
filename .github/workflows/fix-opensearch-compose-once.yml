name: Repair default compose dependency graph once

on:
  push:
    branches: [fix/rc3-typecheck]
    paths:
      - .github/workflows/fix-opensearch-compose-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc3-typecheck
          fetch-depth: 0
      - name: Make OpenSearch available to default AI gateway
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docker-compose.yml')
          text=p.read_text()
          old="  opensearch:\n    profiles:\n    - full\n    image: opensearchproject/opensearch:2.19.1\n"
          new="  opensearch:\n    image: opensearchproject/opensearch:2.19.1\n"
          if old not in text:
              raise SystemExit('expected OpenSearch profile block not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-opensearch-compose-once.yml
          git config user.name 'LoteDiretor CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: include OpenSearch in default compose graph'
          git push origin HEAD:fix/rc3-typecheck

name: Apply RC3 typecheck repairs once

on:
  push:
    branches: [fix/rc3-typecheck]
    paths:
      - .github/workflows/fix-rc3-typecheck-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc3-typecheck
          fetch-depth: 0
      - name: Apply deterministic source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              text2 = text.replace(old, new, 1)
              p.write_text(text2)

          replace_once(
              'services/platform-api/src/core.module.ts',
              "if(r.rowCount<3)return{status:'INSUFFICIENT_DATA',estimateCents:null,comparables:r.rowCount};",
              "const comparableCount=r.rows.length;if(comparableCount<3)return{status:'INSUFFICIENT_DATA',estimateCents:null,comparables:comparableCount};"
          )
          replace_once(
              'services/platform-api/src/core.module.ts',
              "comparables:r.rowCount,confidence:demo?0.25:0.55",
              "comparables:comparableCount,confidence:demo?0.25:0.55"
          )
          replace_once(
              'services/platform-api/src/rural/rural.controller.ts',
              "const changed=previous.rowCount>0&&previous.rows[0].state_hash!==stateHash;",
              "const hasPrevious=previous.rows.length>0;const changed=hasPrevious&&previous.rows[0].state_hash!==stateHash;"
          )
          replace_once(
              'services/platform-api/src/rural/rural.controller.ts',
              "return{monitorId,baseline:!previous.rowCount,changed,stateHash,featureCount:state.length,checkpointId:cp.rows[0].id};",
              "return{monitorId,baseline:!hasPrevious,changed,stateHash,featureCount:state.length,checkpointId:cp.rows[0].id};"
          )
          replace_once(
              'services/platform-api/src/territorial/territorial.service.ts',
              "const passed=cases.rows.filter((x:any)=>x.status==='PASS').length;const failed=cases.rows.filter((x:any)=>x.status==='FAIL').length;const pending=cases.rowCount-passed-failed;",
              "const caseCount=cases.rows.length;const passed=cases.rows.filter((x:any)=>x.status==='PASS').length;const failed=cases.rows.filter((x:any)=>x.status==='FAIL').length;const pending=caseCount-passed-failed;"
          )
          replace_once(
              'services/platform-api/src/territorial/territorial.service.ts',
              "summary:{total:cases.rowCount,passed,failed,pending,minimum:10,homologationReady:cases.rowCount>=10&&failed===0&&pending===0}",
              "summary:{total:caseCount,passed,failed,pending,minimum:10,homologationReady:caseCount>=10&&failed===0&&pending===0}"
          )
          PY
      - name: Remove one-time workflow and commit repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-rc3-typecheck-once.yml
          git config user.name 'LoteDiretor CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy pg v8 strict typecheck'
          git push origin HEAD:fix/rc3-typecheck

name: Generate package lock once

on:
  push:
    branches: [chore/package-lock]
    paths:
      - .github/workflows/generate-package-lock-once.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/package-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from workspace manifests
        run: npm install --package-lock-only --workspaces --include-workspace-root --no-audit --no-fund
      - name: Remove one-time workflow and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          rm -f .github/workflows/generate-package-lock-once.yml
          git config user.name 'LoteDiretor Lockfile Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json .github/workflows/generate-package-lock-once.yml
          git commit -m 'chore: add npm workspace lockfile'
          git push origin HEAD:chore/package-lock

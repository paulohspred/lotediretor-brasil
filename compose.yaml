# Default Docker Compose entrypoint for local development.
# Keep docker-compose.yml as the shared base used by explicit CI/production overlays,
# while ensuring a plain `docker compose up` also starts the persisted A.I TEC job consumer.
include:
  - docker-compose.yml

services:
  aitec-worker:
    build:
      context: .
      dockerfile: workers/aitec/Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql://lotediretor_worker:${PLATFORM_DB_WORKER_PASSWORD:-change-me-worker}@platform-db:5432/${PLATFORM_DB_NAME:-lotediretor}
      AITEC_ENGINE_INTERNAL_URL: ${AITEC_ENGINE_INTERNAL_URL:-http://aitec-engine:8002}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-change-me}
      AITEC_JOB_POLL_SECONDS: ${AITEC_JOB_POLL_SECONDS:-1}
      AITEC_JOB_MAX_ATTEMPTS: ${AITEC_JOB_MAX_ATTEMPTS:-5}
      AITEC_JOB_RETRY_BASE_SECONDS: ${AITEC_JOB_RETRY_BASE_SECONDS:-5}
      AITEC_JOB_RETRY_MAX_SECONDS: ${AITEC_JOB_RETRY_MAX_SECONDS:-60}
      AITEC_METRICS_PORT: ${AITEC_METRICS_PORT:-9104}
    depends_on:
      platform-db:
        condition: service_healthy
      platform-db-role-init:
        condition: service_completed_successfully
      aitec-engine:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/metrics',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

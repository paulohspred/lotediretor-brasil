services:
  platform-db:
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U ${PLATFORM_DB_MIGRATION_USER:-lotediretor} -d ${PLATFORM_DB_NAME:-lotediretor}
      start_period: 15s
  control-db:
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U ${CONTROL_DB_MIGRATION_USER:-lotediretor_control} -d ${CONTROL_DB_NAME:-lotediretor_control}
      start_period: 15s
  opensearch:
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    healthcheck:
      test:
      - CMD-SHELL
      - "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
  ai-gateway:
    depends_on:
      control-api:
        condition: service_healthy
      opensearch:
        condition: service_healthy
  ai-ingest:
    depends_on:
      platform-db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      platform-db-role-init:
        condition: service_completed_successfully
  aitec-worker:
    build:
      context: .
      dockerfile: workers/aitec/Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql://lotediretor_worker:${PLATFORM_DB_WORKER_PASSWORD:-change-me-worker}@platform-db:5432/${PLATFORM_DB_NAME:-lotediretor}
      AITEC_ENGINE_INTERNAL_URL: ${AITEC_ENGINE_INTERNAL_URL:-http://aitec-engine:8002}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-change-me}
      AITEC_JOB_POLL_SECONDS: ${AITEC_JOB_POLL_SECONDS:-0.5}
      AITEC_METRICS_PORT: ${AITEC_METRICS_PORT:-9104}
    depends_on:
      platform-db:
        condition: service_healthy
      platform-db-role-init:
        condition: service_completed_successfully
      aitec-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/metrics',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

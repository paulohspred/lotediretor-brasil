# Local-development override loaded automatically by `docker compose` when
# docker-compose.yml is used without explicit -f files. CI/Cortex/production
# use their own explicit overlays and do not depend on this file.
services:
  opensearch:
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  ai-gateway:
    depends_on:
      control-api:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  ai-ingest:
    depends_on:
      platform-db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      platform-db-role-init:
        condition: service_completed_successfully

  aitec-worker:
    build:
      context: .
      dockerfile: workers/aitec/Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql://lotediretor_worker:${PLATFORM_DB_WORKER_PASSWORD:-change-me-worker}@platform-db:5432/${PLATFORM_DB_NAME:-lotediretor}
      AITEC_ENGINE_INTERNAL_URL: ${AITEC_ENGINE_INTERNAL_URL:-http://aitec-engine:8002}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-change-me}
      AITEC_JOB_POLL_SECONDS: ${AITEC_JOB_POLL_SECONDS:-0.5}
      AITEC_METRICS_PORT: ${AITEC_METRICS_PORT:-9104}
      AITEC_JOB_RETRY_BASE_SECONDS: ${AITEC_JOB_RETRY_BASE_SECONDS:-5}
      AITEC_JOB_RETRY_MAX_SECONDS: ${AITEC_JOB_RETRY_MAX_SECONDS:-60}
    depends_on:
      platform-db:
        condition: service_healthy
      platform-db-role-init:
        condition: service_completed_successfully
      aitec-engine:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; s=urllib.request.urlopen('http://127.0.0.1:9104/metrics',timeout=3).read().decode(); assert 'lotediretor_aitec_worker_ready 1.0' in s"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

# Promotion overlay: production consumes immutable registry artifacts only.
# The CI/build pipeline publishes these images first; staging/prod then promote
# the exact same @sha256 digests. No source build is allowed in this model.
services:
  platform-api:
    build: !reset null
    image: ${PLATFORM_API_IMAGE:?immutable @sha256 image required}
  platform-migrate:
    build: !reset null
    image: ${PLATFORM_API_IMAGE:?immutable @sha256 image required}
  control-api:
    build: !reset null
    image: ${CONTROL_API_IMAGE:?immutable @sha256 image required}
  control-migrate:
    build: !reset null
    image: ${CONTROL_API_IMAGE:?immutable @sha256 image required}
  ai-gateway:
    build: !reset null
    image: ${AI_GATEWAY_IMAGE:?immutable @sha256 image required}
  solar-engine:
    build: !reset null
    image: ${SOLAR_ENGINE_IMAGE:?immutable @sha256 image required}
  aitec-engine:
    build: !reset null
    image: ${AITEC_ENGINE_IMAGE:?immutable @sha256 image required}
  event-dispatcher:
    build: !reset null
    image: ${EVENT_DISPATCHER_IMAGE:?immutable @sha256 image required}
  geo-worker:
    build: !reset null
    image: ${GEO_WORKER_IMAGE:?immutable @sha256 image required}
  document-worker:
    build: !reset null
    image: ${DOCUMENT_WORKER_IMAGE:?immutable @sha256 image required}
  report-worker:

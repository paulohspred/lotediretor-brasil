global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: platform-api
    metrics_path: /metrics
    static_configs: [{targets: ['platform-api:3001']}]
  - job_name: control-api
    metrics_path: /metrics
    static_configs: [{targets: ['control-api:3002']}]
  - job_name: solar-engine
    metrics_path: /metrics
    static_configs: [{targets: ['solar-engine:8001']}]
  - job_name: aitec-engine
    metrics_path: /metrics
    static_configs: [{targets: ['aitec-engine:8002']}]
